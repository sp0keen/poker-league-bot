<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табло турнира</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050d1a;
    --panel:#0a1729;
    --panel-2:#0d1d33;
    --border:rgba(86,140,214,.22);
    --border-soft:rgba(140,170,215,.12);
    --text:#ffffff;
    --text-2:#c9d6e8;
    --dim:#8196b3;
    --accent:#3d8bff;
    --accent-2:#5aa2ff;
    --icon:#b8cbe6;
    --red:#ff4d5e;
    --green:#27d07c;
    --gold:#ffc54d;
    --num:'Roboto Condensed','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:'Roboto','Segoe UI',sans-serif;color:var(--text);position:relative}

  /* фиксированный холст 1920×1080, масштабируется под экран (ТВ/проектор/ноутбук) */
  .stage{
    position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    padding:22px 24px;display:grid;
    grid-template-rows:92px 1fr;gap:18px;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(40,100,200,.18), transparent 70%),
      radial-gradient(900px 600px at 50% 110%, rgba(30,80,170,.12), transparent 70%),
      var(--bg);
    transform-origin:0 0;
  }
  .panel{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--border);border-radius:14px;
    box-shadow:0 0 0 1px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .ico{width:40px;height:40px;color:var(--icon);flex:none}
  .ico svg{width:100%;height:100%;display:block}
  .cap{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2)}
  .num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}

  /* ---------- header ---------- */
  .header{display:flex;align-items:center;padding:0 32px 0 26px}
  .brand{display:flex;align-items:center;gap:18px;flex:1}
  .brand .logo{width:44px;height:50px;color:var(--accent)}
  .brand h1{font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1}
  .brand .sub{margin-top:7px;font-size:16px;color:var(--text-2);display:flex;gap:12px;align-items:center}
  .brand .sub i{font-style:normal;color:var(--dim)}
  .hstat{display:flex;align-items:center;gap:14px;padding:0 30px;border-left:1px solid var(--border);height:56px}
  .hstat:last-child{padding-right:0}
  .hstat .ico{width:38px;height:38px}
  /* по центру шапки стоит вся связка "подпись + число" (зазоры сверху и снизу равны), иконка — тоже по центру шапки */
  .hstat .txt{text-align:center}
  .hstat .lbl{font-size:12px;line-height:14px;margin-bottom:6px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .hstat .val{font-size:26px;line-height:1;position:relative;display:inline-block}
  /* приписка к числу ("/чел.") — в строке, так что "2 /чел." центрируется под подписью целиком */
  .hstat .val small{margin-left:3px;font:500 12px/1 'Roboto',sans-serif;letter-spacing:.04em;color:var(--dim);white-space:nowrap}

  /* ---------- main grid ---------- */
  .main{display:grid;grid-template-columns:450px minmax(0,1fr) 450px;gap:20px;min-height:0}
  .col{display:flex;flex-direction:column;gap:20px;min-height:0}

  /* left: stats */
  .stats{padding:10px 24px}
  .stat{display:flex;align-items:center;gap:20px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
  .stat:last-child{border-bottom:none}
  .stat .lbl{font-size:15px;line-height:18px;color:var(--dim)}
  .stat .val{font-size:28px;margin-top:5px;line-height:1.05}
  .stat .val small{font-family:'Roboto';font-weight:400;font-size:15px;color:var(--dim);margin-left:8px}
  .prizes{display:flex;gap:16px;margin-top:6px;font-size:15px;color:var(--text-2)}
  .prizes span{display:flex;align-items:center;gap:6px}
  .prizes b{font-family:var(--num);font-size:18px;color:var(--text)}
  .medal{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:normal 700 11px/1 'Roboto',sans-serif;font-variant-numeric:tabular-nums;color:#0a1729}

  /* left: standings */
  .standings{flex:1;padding:16px 20px 12px;display:flex;flex-direction:column;min-height:0}
  .standings .cap{color:var(--text);font-size:17px;margin:0 4px 10px}
  table{width:100%;border-collapse:collapse;font-size:18px}
  th{font-size:14px;font-weight:500;color:var(--dim);text-align:left;padding:6px 8px;letter-spacing:.02em}
  td{padding:0 8px;height:42px;border-top:1px solid var(--border-soft);color:var(--text-2);white-space:nowrap}
  td.r,th.r{text-align:right}
  td.c,th.c{text-align:center}
  td.name{color:var(--text);max-width:150px;overflow:hidden;text-overflow:ellipsis}
  td.pts{font-family:var(--num);font-weight:700;font-size:20px;color:var(--text)}
  td.pts.pos{color:var(--green)} td.pts.neg{color:var(--red)}
  /* точка/место по центру своей колонки: от левого края до неё столько же, сколько от неё до имени
     (правое поле колонки + левое поле имени = 8 + 8) */
  td.place,th:first-child{width:44px;padding:0 0 0 8px;text-align:center}
  td.place{font-family:var(--num);font-weight:700}
  tr.lead{background:linear-gradient(90deg,rgba(39,208,124,.24),rgba(39,208,124,.05))}
  tr.lead td:first-child{box-shadow:inset 4px 0 0 var(--green)}
  tr.out td{color:var(--dim)} tr.out td.name{color:var(--dim)}
  .live{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(39,208,124,.7)}

  /* center: level */
  .levelcard{padding:0 24px 22px;display:flex;flex-direction:column}
  .lvtop{display:flex;align-items:center;height:124px}
  /* те же правила, что у плашек в шапке: связка "подпись + значение" по центру по вертикали,
     значение по центру подписи, иконка по центру всей связки */
  .lvtop .tstat{flex:1;display:flex;align-items:center;justify-content:center;gap:22px}
  .lvtop .vsep{flex:none;width:1px;height:76px;background:var(--border)}
  .lvtop .ico{width:62px;height:62px;color:var(--accent)}
  .lvtop .txt{text-align:center}
  .lvtop .lbl{font-size:14px;line-height:16px;margin-bottom:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .lvtop .txt .num{font-size:52px;line-height:1}
  .late.closed .lbl{color:var(--red)}
  .late.closed .txt .num{color:var(--dim)}

  .blinds{display:flex;align-items:center;border:1px solid var(--border);border-radius:12px;height:222px;background:rgba(5,14,28,.45)}
  .blinds .bcell{flex:1;min-width:0;height:100%;padding:0 36px;display:flex;align-items:center;justify-content:center}
  .blinds .bcell:first-child{flex:1.45}
  /* как в шапке: связка "подпись + число" по центру блока, число по центру подписи */
  .v{display:inline-flex;flex-direction:column;align-items:center}
  .blinds .v > .cap{font-size:17px;line-height:20px;letter-spacing:.08em;margin-bottom:10px;opacity:.85;white-space:nowrap}
  /* высота строки числа фиксирована — если шрифт ужался под 1 000 / 2 000, подпись не прыгает */
  .blinds .num{white-space:nowrap;font-size:104px;line-height:1;height:104px;display:flex;align-items:center}
  .blinds .sep{flex:none;width:1px;height:128px;background:var(--border)}
  .blinds.noante .sep,.blinds.noante .ante{display:none}

  /* те же правила, что в шапке и у таймеров: весь блок (заголовок + подписи + значения) по центру
     по вертикали, значения по центру своих подписей, иконка таймера по центру связки "подпись + время" */
  /* превью следующего уровня: те же цифры, но приглушённые — чтобы не путать с текущим */
  .next{margin-top:22px;border:1px solid var(--border);border-radius:12px;height:196px;padding:0 28px;background:rgba(5,14,28,.35);display:flex;flex-direction:column;justify-content:center}
  /* как в шапке: колонки по ширине содержимого с одинаковыми полями до разделителей,
     вся строка — по центру блока (а не три равные трети, где узкое значение "тонет") */
  .nextrow{display:flex;align-items:stretch;justify-content:center}
  .nextrow .cell{flex:none;padding:0 48px;border-left:1px solid var(--border);display:flex;justify-content:center;align-items:center}
  .nextrow .cell:first-child{border-left:none}
  .nextrow .txt{text-align:center}
  .nextrow .lbl{font-size:13px;line-height:16px;font-weight:500;color:#4f76ad;letter-spacing:.08em;margin-bottom:6px;white-space:nowrap}
  .nextrow .num{color:#8a9bb3;font-size:62px;line-height:1;white-space:nowrap;height:62px;display:flex;align-items:center;justify-content:center}
  .nextrow .tgroup{display:flex;align-items:center;gap:16px}
  .nextrow .tgroup .ico{width:50px;height:50px;color:#3f69a6}
  .next.noante .ante{display:none}

  /* center: structure */
  .structure{flex:1;position:relative;display:grid;place-items:center}
  .structure .cap{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:19px}
  /* окно на STEPS_VISIBLE уровней; лента внутри целиком, сдвигается transform'ом */
  .ladder-view{width:880px;overflow:hidden;padding-top:40px;margin-top:10px}
  .ladder{display:flex;align-items:flex-start;transition:transform .8s cubic-bezier(.4,0,.2,1)}
  .step{flex:none;width:110px;display:flex;flex-direction:column;align-items:center;position:relative}
  .step::before{content:"";position:absolute;top:30px;left:-50%;width:100%;height:2px;background:rgba(120,150,195,.25);z-index:0}
  .step:first-child::before{display:none}
  .dot{position:relative;z-index:1;width:60px;height:60px;border-radius:50%;border:2px solid #9fb2cc;display:grid;place-items:center;
       font-family:var(--num);font-size:28px;font-weight:700;background:var(--panel);color:var(--text)}
  .step .b{font-family:var(--num);font-weight:700;font-size:22px;margin-top:14px;color:var(--text-2)}
  .step .m{font-size:17px;color:var(--dim);margin-top:4px}
  .step.past .dot{border-color:rgba(159,178,204,.35);color:var(--dim)}
  .step.past .b{color:var(--dim)}
  .step.cur .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 24px rgba(61,139,255,.6)}
  .step.cur .b,.step.cur .m{color:var(--accent-2)}
  .step.closedre .dot{border-style:dashed}
  /* граница окончания ре-энтри между уровнями */
  .step.reend::after{content:"";position:absolute;top:-12px;right:-2px;width:3px;height:84px;border-radius:2px;background:var(--red);opacity:.85;z-index:2}
  .reflag{position:absolute;top:-36px;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--red);white-space:nowrap}

  /* right: events */
  .events{padding:20px 12px 0;display:flex;flex-direction:column;min-height:0}
  .events > .cap{color:var(--text);font-size:21px;padding:0 12px 16px;border-bottom:1px solid var(--border-soft)}
  /* поля по бокам — чтобы подсветка нового события не упиралась во время */
  .ev{display:flex;align-items:center;gap:18px;padding:18px 12px 17px 24px;border-bottom:1px solid var(--border-soft);border-radius:8px}
  .ev:last-child{border-bottom:none}
  /* время и иконка — по центру строки; от края до времени столько же, сколько от времени до иконки */
  .ev .time{font-size:18px;color:var(--text-2);margin-right:6px;font-variant-numeric:tabular-nums}
  .ev .ico{width:40px;height:40px}
  .ev .txt{flex:1;min-width:0}
  .ev .main-t{font-size:18px;line-height:1.35;color:var(--text)}
  .ev .main-t b{font-weight:500}
  .ev .sub{font-size:15px;color:var(--text-2);margin-top:6px}
  .ev .sub .hl{color:var(--accent-2)}
  .ev.bust .ico{color:var(--red)}
  .ev.rebuy .ico{color:var(--gold)}
  .ev.join .ico{color:var(--green)}
  .ev.level .ico{color:var(--accent)}
  .ev.fresh{animation:flash 2.4s ease-out}
  @keyframes flash{0%{background:rgba(61,139,255,.18)}100%{background:transparent}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .overlay{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:var(--text-2);font-size:28px;text-align:center;padding:24px}
  .overlay[hidden]{display:none}
  .overlay .logo{width:72px;height:80px;color:var(--accent)}
  /* пауза: таймер до следующего уровня мигает */
  .next.paused #n-in{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
</style>
</head>
<body>
<div class="overlay" id="overlay" hidden><div class="logo" data-icon="spade"></div><div class="msg"></div></div>
<div class="stage" id="stage">

  <header class="panel header">
    <div class="brand">
      <div class="logo" data-icon="spade"></div>
      <div>
        <h1>HOME POKER TOURNAMENT</h1>
        <div class="sub" id="subline"></div>
      </div>
    </div>
    <div class="hstat"><div class="ico" data-icon="users"></div><div class="txt"><div class="lbl">Участники</div><div class="val num" id="h-players"></div></div></div>
    <div class="hstat"><div class="ico" data-icon="reentry"></div><div class="txt"><div class="lbl">Ре-энтри</div><div class="val num" id="h-reentry"></div></div></div>
    <div class="hstat"><div class="ico" data-icon="chips"></div><div class="txt"><div class="lbl">Стартовый стек</div><div class="val num" id="h-stack"></div></div></div>
  </header>

  <div class="main">
    <!-- LEFT -->
    <div class="col">
      <section class="panel stats">
        <div class="stat"><div class="ico" data-icon="trophy"></div><div><div class="lbl">Призовой фонд</div><div class="val num" id="s-bank"></div><div class="prizes" id="s-prizes"></div></div></div>
        <div class="stat"><div class="ico" data-icon="users"></div><div><div class="lbl">Текущие участники</div><div class="val num" id="s-players"></div></div></div>
        <div class="stat"><div class="ico" data-icon="reentry"></div><div><div class="lbl">Ре-энтри (сделано / резерв)</div><div class="val num" id="s-reentry"></div></div></div>
        <div class="stat"><div class="ico" data-icon="chips"></div><div><div class="lbl">Средний стек</div><div class="val num" id="s-avg"></div></div></div>
        <div class="stat"><div class="ico" data-icon="chips"></div><div><div class="lbl">Общий стек в игре</div><div class="val num" id="s-total"></div></div></div>
      </section>

      <section class="panel standings">
        <div class="cap">Текущая таблица</div>
        <table>
          <thead><tr><th>#</th><th>Игрок</th><th class="r">Очки</th><th class="r">Приз</th><th class="c">RE</th><th class="c">KO</th></tr></thead>
          <tbody id="standings"></tbody>
        </table>
      </section>
    </div>

    <!-- CENTER -->
    <div class="col">
      <section class="panel levelcard">
        <div class="lvtop">
          <div class="tstat elapsed">
            <div class="ico" data-icon="play"></div>
            <div class="txt"><div class="lbl">Идёт игра</div><div class="num" id="elapsed-t"></div></div>
          </div>
          <div class="vsep"></div>
          <div class="tstat late" id="late">
            <div class="ico" data-icon="clock"></div>
            <div class="txt"><div class="lbl" id="late-cap">Поздняя регистрация</div><div class="num" id="late-t"></div></div>
          </div>
        </div>
        <div class="blinds" id="blinds">
          <div class="bcell"><div class="v fit"><div class="cap">SB / BB</div><div class="num" id="c-blinds"></div></div></div>
          <div class="sep"></div>
          <div class="bcell ante"><div class="v fit"><div class="cap">Анте</div><div class="num" id="c-ante"></div></div></div>
        </div>
        <div class="next" id="next">
          <div class="nextrow">
            <div class="cell"><div class="tgroup fit"><div class="ico" data-icon="stopwatch"></div><div class="txt"><div class="lbl" id="n-in-lbl">ЧЕРЕЗ</div><div class="num" id="n-in"></div></div></div></div>
            <div class="cell"><div class="txt fit"><div class="lbl">SB / BB</div><div class="num" id="n-blinds"></div></div></div>
            <div class="cell ante"><div class="txt fit"><div class="lbl">АНТЕ</div><div class="num" id="n-ante"></div></div></div>
          </div>
        </div>
      </section>

      <section class="panel structure">
        <div class="cap">Структура турнира</div>
        <div class="ladder-view"><div class="ladder" id="ladder"></div></div>
      </section>
    </div>

    <!-- RIGHT -->
    <div class="col">
      <section class="panel events" style="flex:1">
        <div class="cap">Последние события</div>
        <div id="events"></div>
      </section>
    </div>
  </div>
</div>

<script>
/* ============ иконки ============ */
const ICONS = {
  spade:`<svg viewBox="0 0 64 72" fill="currentColor"><path d="M32 2C26 14 4 26 4 43c0 9 7 16 15.5 16 5 0 9-2.4 11-6-.6 6-3 11-8.5 15h20c-5.5-4-7.9-9-8.5-15 2 3.6 6 6 11 6C53 59 60 52 60 43 60 26 38 14 32 2z"/></svg>`,
  users:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="7.5" r="3.6"/><path d="M2 19.5c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5V21H2z"/><circle cx="17" cy="8.5" r="2.8" opacity=".75"/><path d="M17.2 12.8c3 .2 5 2.3 5 5.4V20h-4.4v-.6c0-2.6-.9-4.8-2.6-6.3.6-.2 1.3-.3 2-.3z" opacity=".75"/></svg>`,
  reentry:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/></svg>`,
  chips:`<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 8.2c1.6 1.4 4.6 2.3 8 2.3s6.4-.9 8-2.3V10c0 1.7-3.6 3-8 3s-8-1.3-8-3z"/><path d="M4 12.7c1.6 1.4 4.6 2.3 8 2.3s6.4-.9 8-2.3v1.8c0 1.7-3.6 3-8 3s-8-1.3-8-3z"/><path d="M4 17.2c1.6 1.4 4.6 2.3 8 2.3s6.4-.9 8-2.3V19c0 1.7-3.6 3-8 3s-8-1.3-8-3z"/><path d="M9.3 4.6h2v-1h1.4v1h2v1.2h-2v1h-1.4v-1h-2z" fill="#0d1d33"/></svg>`,
  trophy:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12v2h3.5v2.5c0 3-2.2 5.4-5 5.8A6 6 0 0 1 13 15.8V18h3.5v2.5h-9V18H11v-2.2a6 6 0 0 1-3.5-3.5c-2.8-.4-5-2.8-5-5.8V4H6zm0 4H4.5v.5c0 1.8 1.1 3.3 2.5 3.8A6 6 0 0 1 6 8zm12 0v2c0 .8-.3 1.6-1 2.3 1.4-.5 2.5-2 2.5-3.8V6z"/><rect x="6" y="21" width="12" height="1.6" rx=".8"/></svg>`,
  clock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.8 2.4"/></svg>`,
  stopwatch:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13.5" r="8.5"/><path d="M12 8.5v5l3 2M9.5 2h5M19 5.5l1.5-1.5"/></svg>`,
  skull:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.8 2 3 5.7 3 10.5c0 2.8 1.3 5 3.3 6.3V19c0 .8.7 1.5 1.5 1.5H9V22h1.8v-1.5h2.4V22H15v-1.5h1.2c.8 0 1.5-.7 1.5-1.5v-2.2c2-1.3 3.3-3.5 3.3-6.3C21 5.7 17.2 2 12 2z"/><circle cx="8.6" cy="11.3" r="2.3" fill="#0d1d33"/><circle cx="15.4" cy="11.3" r="2.3" fill="#0d1d33"/><path d="M12 14l-1.3 2.4h2.6z" fill="#0d1d33"/></svg>`,
  /* докупка (re-entry): фишка с плюсом */
  buyin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="13" r="8.2"/><circle cx="11" cy="13" r="4.4" stroke-dasharray="2.2 2.2"/><path d="M11 4.8v2.4M11 18.8v2.4M2.8 13h2.4M16.8 13h2.4" stroke-width="2.4"/><circle cx="19" cy="5" r="4.2" fill="currentColor" stroke="none"/><path d="M19 3v4M17 5h4" stroke="#0d1d33" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  join:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9.5" cy="7.5" r="3.8"/><path d="M2 20c0-4 3.3-6.8 7.5-6.8S17 16 17 20v1H2z"/><path d="M19 7v3h3v2h-3v3h-2v-3h-3v-2h3V7z"/></svg>`,
  play:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.3v7.4l6-3.7z" fill="currentColor"/></svg>`,
  up:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V4M5 10.5 12 3.5l7 7"/></svg>`
};
function paintIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon]; });
}

/* ============ правила — те же, что в боте ============ */
// scoring.js
const PLACEMENT_POINTS = {
  4:[6,2,0,-1], 5:[7,4,2,0,-1], 6:[8,6,3,1,0,-2], 7:[9,7,5,3,1,0,-2],
  8:[10,8,6,4,2,1,0,-2], 9:[11,9,7,5,4,2,1,-1,-3], 10:[12,10,8,7,5,3,2,1,-1,-3]
};
const placementPoints = (place, N) => (PLACEMENT_POINTS[N] || [])[place - 1] || 0;
// chipStructure.js: prizeBreakdown
function prizeBreakdown(bank, N) {
  const round100 = v => Math.round(v / 100) * 100;
  const shares = N <= 4 ? [0.65, 0.35] : [0.5, 0.3, 0.2];
  const amounts = shares.slice(0, -1).map(s => round100(bank * s));
  let last = bank - amounts.reduce((s, a) => s + a, 0);
  const prev = amounts[amounts.length - 1];
  if (last > prev) { amounts[0] += last - prev; last = prev; }
  amounts.push(last);
  return amounts.map((amount, i) => ({ place: i + 1, amount }));
}

const MIN = 60000;

/* ============ источник данных ============ */
// /t/<ключ> — живое табло турнира из бота (SSE). Открытый напрямую файл — демо на выдуманных данных
const LIVE_KEY = (location.pathname.match(/^\/t\/([A-Za-z0-9_-]+)/) || [])[1] || null;
let clockOffset = 0; // серверное время − локальное: таймеры считаются от серверных моментов
const now = () => Date.now() + clockOffset;

// демо — в том же виде, что отдаёт бот (scoreboardView в index.js)
function demoGame() {
  const loadedAt = Date.now();
  const levelLeftMs = 12 * MIN + 34000;
  const startedAt = loadedAt - (6 * 20 * MIN - levelLeftMs); // идёт 6-й уровень
  const at = m => new Date(startedAt + m * MIN).toISOString();
  const sbs = [5,10,15,25,50,75,100,150,200,300,400,500,750,1000,1500,2000,3000];
  const levels = [{ sb: 5, bb: 10, ante: 0 }, ...sbs.map(sb => ({ sb, bb: sb * 2, ante: sb * 2 }))].map(l => ({ ...l, minutes: 20 }));
  const lvl = i => ({ type: 'LEVEL', sb: levels[i].sb, bb: levels[i].bb, ante: levels[i].ante });
  const demoLevel = Number(new URLSearchParams(location.search).get('level')); // ?level=15 — крупные блайнды
  return {
    status: 'live', startedAt: new Date(startedAt).toISOString(), endedAt: null,
    buyIn: 0, chipStack: 1000, maxRebuys: 2, levels, lastRebuyLevel: 8,
    blindLevel: demoLevel > 1 ? Math.min(demoLevel, levels.length) - 1 : 5,
    timer: { levelEndsAt: loadedAt + levelLeftMs, pausedRemainingMs: null },
    players: { p1:'Вова', p2:'Никита', p3:'Yuriy Shorin', p4:'Данил Шеронов', p5:'Настя', p6:'Ксюша', p7:'Фил', p8:'Артём' },
    rebuys: { p1:0, p2:0, p3:1, p4:0, p5:2, p6:0, p7:0, p8:0 },
    knockouts: { p1:2, p2:1, p3:0, p4:1, p5:0, p6:1, p7:0, p8:0 },
    busted: ['p7', 'p5'],
    log: [
      { type:'BUST', id:'p5', by:'p1', at:at(18) }, { ...lvl(1), at:at(20) }, { type:'REBUY', id:'p5', at:at(21) },
      { type:'JOIN', id:'p8', at:at(34) }, { ...lvl(2), at:at(40) }, { type:'BUST', id:'p3', by:'p2', at:at(52) },
      { type:'REBUY', id:'p3', at:at(53) }, { ...lvl(3), at:at(60) }, { type:'BUST', id:'p7', by:'p4', at:at(71) },
      { ...lvl(4), at:at(80) }, { type:'BUST', id:'p5', by:'p6', at:at(88) }, { type:'REBUY', id:'p5', at:at(89) },
      { type:'BUST', id:'p5', by:'p1', at:at(97) }, { ...lvl(5), at:at(100) }
    ]
  };
}

/* ============ производные ============ */
function derive(g) {
  const ids = Object.keys(g.players);
  const N = ids.length;
  const busted = g.busted.filter(id => g.players[id] != null);
  const remaining = ids.filter(id => !busted.includes(id));
  const rebuys = id => g.rebuys[id] || 0, ko = id => g.knockouts[id] || 0;
  const totalRebuys = ids.reduce((s, id) => s + rebuys(id), 0);
  const stake = g.buyIn || g.chipStack;
  const bank = stake * (N + totalRebuys);                 // totalInvested в боте
  const totalChips = g.chipStack * (N + totalRebuys);     // фишки сохраняются: всё, что выдали
  const avg = remaining.length ? Math.round(totalChips / remaining.length) : 0;
  const prizes = prizeBreakdown(bank, N);
  const prizeFor = place => { const p = prizes.find(x => x.place === place); return p && p.amount > 0 ? p.amount : null; };
  const finished = g.status === 'finished' && remaining.length === 1;

  // живая таблица — как liveStandingsHtml в index.js; после финала оставшийся — 1-е место
  const rows = remaining.map(id => finished
    ? { id, live: false, place: 1, points: placementPoints(1, N) - 2 * rebuys(id) + ko(id), prize: prizeFor(1) }
    : { id, live: true, place: null, points: ko(id) - 2 * rebuys(id), prize: null });
  for (let i = busted.length - 1; i >= 0; i--) {
    const id = busted[i], place = N - i;
    rows.push({ id, live: false, place, points: placementPoints(place, N) - 2 * rebuys(id) + ko(id), prize: prizeFor(place) });
  }
  rows.sort((a, b) => b.points - a.points || (a.live === b.live ? (a.place || 0) - (b.place || 0) : a.live ? -1 : 1));
  rows.forEach(r => { r.rebuys = rebuys(r.id); r.ko = ko(r.id); });

  const rebuysBefore = (id, idx) => g.log.slice(0, idx).filter(e => e.type === 'REBUY' && e.id === id).length;
  return { rebuysBefore, N, remaining, busted, totalRebuys, bank, totalChips, avg, prizes, rows };
}

/* ============ рендер ============ */
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('ru-RU');
const blinds = l => `${fmt(l.sb)} / ${fmt(l.bb)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`; };
const hhmmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2,'0')).join(':'); };
const clock = iso => new Date(iso).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });

let shownEvents = null; // сколько событий уже было на экране — подсвечиваем только новые

function renderStatic(g, d) {
  const lv = g.levels, cur = Math.min(g.blindLevel, lv.length - 1), unit = g.buyIn ? '₽' : 'фишек';
  const hasAnte = lv.some(l => l.ante);

  $('subline').innerHTML = ['Texas Hold’em', g.buyIn ? `Бай-ин ${fmt(g.buyIn)} ₽` : 'No Money', `Уровни по ${lv[cur].minutes} мин`, hasAnte ? 'Анте = BB' : null]
    .filter(Boolean).map(esc).join('<i>•</i>');
  // в шапке — сколько всего заявилось на турнир; сколько ещё в игре — слева в статистике
  $('h-players').textContent = d.N;
  $('h-reentry').innerHTML = `${g.maxRebuys}<small>/чел.</small>`;
  $('h-stack').textContent = fmt(g.chipStack);

  $('s-bank').innerHTML = `${fmt(d.bank)}<small>${unit}</small>`;
  const medalColor = ['#ffc54d', '#cfd8e6', '#d88a4e'];
  $('s-prizes').innerHTML = d.prizes.filter(p => p.amount > 0)
    .map(p => `<span><i class="medal" style="background:${medalColor[p.place - 1]}">${p.place}</i><b>${fmt(p.amount)}</b></span>`).join('');
  $('s-players').textContent = `${d.remaining.length} / ${d.N}`;
  $('s-reentry').textContent = `${d.totalRebuys} / ${g.maxRebuys * d.N}`;
  $('s-avg').textContent = fmt(d.avg);
  $('s-total').textContent = fmt(d.totalChips);

  // больше 8 строк не влезает — 9-й и 10-й просто не показываем
  $('standings').innerHTML = d.rows.slice(0, 8).map((r, i) => {
    const cls = [i === 0 ? 'lead' : '', r.live || r.place === 1 ? '' : 'out'].join(' ');
    const pts = `${r.points > 0 ? '+' : ''}${r.points}`;
    const ptsCls = r.points > 0 ? 'pos' : r.points < 0 ? 'neg' : '';
    return `<tr class="${cls}"><td class="place">${r.live ? '<span class="live"></span>' : r.place}</td>` +
      `<td class="name">${esc(g.players[r.id])}</td><td class="r pts ${ptsCls}">${pts}</td>` +
      `<td class="r">${r.prize ? fmt(r.prize) : '—'}</td><td class="c">${r.rebuys}</td><td class="c">${r.ko}</td></tr>`;
  }).join('');

  // центр
  const nowLv = lv[cur], nxt = lv[cur + 1];
  $('c-blinds').textContent = blinds(nowLv);
  $('c-ante').textContent = fmt(nowLv.ante);
  $('blinds').classList.toggle('noante', !hasAnte);
  $('next').classList.toggle('noante', !hasAnte);
  $('n-blinds').textContent = nxt ? blinds(nxt) : '—';
  $('n-ante').textContent = nxt ? fmt(nxt.ante) : '—';

  // структура: вся лента уровней, в окне видно STEPS_VISIBLE, текущий — 4-й слева
  const lastRe = g.lastRebuyLevel;
  let html = '';
  for (let i = 0; i < lv.length; i++) {
    const st = i < cur ? 'past' : i === cur ? 'cur' : '';
    const re = i === lastRe ? 'reend' : i > lastRe ? 'closedre' : '';
    html += `<div class="step ${st} ${re}"><div class="dot">${i + 1}</div><div class="b">${lv[i].sb}/${lv[i].bb}</div><div class="m">0:${String(lv[i].minutes).padStart(2,'0')}</div>` +
      (i === lastRe && i < lv.length - 1 ? `<div class="reflag" style="left:100%">КОНЕЦ РЕ-ЭНТРИ</div>` : '') + `</div>`;
  }
  $('ladder').innerHTML = html;
  const from = Math.max(0, Math.min(cur - 3, lv.length - STEPS_VISIBLE));
  $('ladder').style.transform = `translateX(${-from * STEP_W}px)`;

  // события — последние 7, новые сверху. Номер уровня в логе не хранится — считаем по порядку
  const rebuyNo = {}, lastBustIdx = {};
  let levelNo = 0;
  g.log.forEach((e, i) => { if (e.type === 'BUST') lastBustIdx[e.id] = i; });
  const name = id => `<b>${esc(g.players[id] || 'Игрок')}</b>`;
  const items = g.log.map((e, i) => {
    if (e.type === 'BUST') {
      const final = d.busted.includes(e.id) && lastBustIdx[e.id] === i;
      const place = final ? d.N - d.busted.indexOf(e.id) : null;
      return { e, cls: 'bust', icon: 'skull',
        text: e.by ? `${name(e.by)} выбивает ${name(e.id)}` : `${name(e.id)} выбывает`,
        sub: final ? `Вылет · <span class="hl">${place} место</span>` : `Осталось ре-энтри: <span class="hl">${Math.max(0, g.maxRebuys - d.rebuysBefore(e.id, i))}</span>` };
    }
    if (e.type === 'REBUY') {
      rebuyNo[e.id] = (rebuyNo[e.id] || 0) + 1;
      return { e, cls: 'rebuy', icon: 'buyin', text: `${name(e.id)} делает ре-энтри`,
        sub: `Стек: ${fmt(g.chipStack)} · <span class="hl">${rebuyNo[e.id]} / ${g.maxRebuys}</span> · −2 очка` };
    }
    if (e.type === 'JOIN') {
      return { e, cls: 'join', icon: 'join', text: `${name(e.id)} присоединяется к турниру`, sub: `Стек: ${fmt(g.chipStack)}` };
    }
    levelNo++;
    return { e, cls: 'level', icon: 'up', text: 'Повышен уровень блайндов',
      sub: `Уровень ${levelNo} → ${levelNo + 1} &nbsp;|&nbsp; ${e.sb}/${e.bb}` + (e.ante ? ` &nbsp;Анте ${e.ante}` : '') };
  }).filter(it => it.e.at);
  const fresh = shownEvents != null && items.length > shownEvents;
  shownEvents = items.length;
  $('events').innerHTML = items.slice(-7).reverse().map((it, i) =>
    `<div class="ev ${it.cls}${i === 0 && fresh ? ' fresh' : ''}"><div class="time">${clock(it.e.at)}</div><div class="ico" data-icon="${it.icon}"></div>` +
    `<div class="txt"><div class="main-t">${it.text}</div><div class="sub">${it.sub}</div></div></div>`).join('');

  paintIcons();
}

const STEPS_VISIBLE = 8, STEP_W = 110;

// блайнды и анте — один размер шрифта: берём максимальный, при котором оба влезают в свои
// ячейки с запасом по краям (1 000 / 2 000 заметно шире, чем 50 / 100)
function fitGroup(ids, cellSel, max, pad) {
  const els = ids.map($).filter(el => el.offsetParent);
  let size = max;
  const fits = () => els.every(el => el.closest('.fit').offsetWidth <= el.closest(cellSel).clientWidth - pad);
  els.forEach(el => { el.style.fontSize = size + 'px'; });
  while (size > 24 && !fits()) {
    size -= 2;
    els.forEach(el => { el.style.fontSize = size + 'px'; });
  }
}

// превью следующего уровня: колонки по ширине содержимого, поэтому ужимаем SB/BB и анте,
// вместе с таймером (все три одного размера), пока вся строка не влезет в блок
function fitNext() {
  const row = document.querySelector('.nextrow'), box = $('next');
  const els = ['n-in', 'n-blinds', 'n-ante'].map($);
  let size = 62;
  const apply = () => els.forEach(el => { el.style.fontSize = size + 'px'; });
  apply();
  while (size > 24 && row.scrollWidth > box.clientWidth - 56) { size -= 2; apply(); }
}

function fitBlinds() {
  if (!$('overlay').hidden) return;
  fitGroup(['c-blinds', 'c-ante'], '.bcell', 104, 72);
  fitNext();
}

let game = null;

// нечего показывать: стол не найден (неверная ссылка / давно закончился) или отменён
function isBlank(g) {
  return !g || g.status === 'missing' || g.status === 'cancelled' || !g.levels || !g.levels.length;
}

function render(g) {
  game = g;
  const overlay = $('overlay');
  if (isBlank(g)) {
    overlay.querySelector('.msg').textContent = g && g.status === 'cancelled' ? 'Турнир отменён' : 'Турнир не найден или уже закончился';
    overlay.hidden = false;
    return;
  }
  overlay.hidden = true;
  renderStatic(g, derive(g));
  fitBlinds();
  renderTimers();
}

// демо: смена уровня (в живой версии её делает бот и присылает новое состояние)
function demoNextLevel(g) {
  if (g.blindLevel >= g.levels.length - 1) return;
  g.blindLevel++;
  const l = g.levels[g.blindLevel];
  g.log.push({ type: 'LEVEL', sb: l.sb, bb: l.bb, ante: l.ante, at: new Date().toISOString() });
  g.timer.levelEndsAt = Date.now() + l.minutes * MIN;
  render(g);
}

function renderTimers() {
  const g = game;
  if (isBlank(g)) return;
  const lv = g.levels, cur = g.blindLevel, t = g.timer;
  const ended = g.status === 'finished';
  const paused = !ended && Boolean(t) && t.pausedRemainingMs != null;
  const left = !t ? 0 : paused ? t.pausedRemainingMs : Math.max(0, t.levelEndsAt - now());
  // уровень по таймеру в живом режиме меняет бот (раз в несколько секунд) — до этого просто 00:00
  if (!LIVE_KEY && !paused && left <= 0) return demoNextLevel(g);

  const start = new Date(g.startedAt).getTime();
  $('elapsed-t').textContent = hhmmss((ended && g.endedAt ? new Date(g.endedAt).getTime() : now()) - start);

  const hasNext = cur < lv.length - 1;
  $('n-in').textContent = ended || !hasNext ? '—' : mmss(left);
  $('n-in-lbl').textContent = paused ? 'ПАУЗА' : 'ЧЕРЕЗ';
  $('next').classList.toggle('paused', paused);

  const late = $('late');
  if (ended) {
    late.classList.add('closed');
    $('late-cap').textContent = 'Турнир';
    $('late-t').textContent = 'ЗАВЕРШЁН';
  } else if (cur > g.lastRebuyLevel) {
    late.classList.add('closed');
    $('late-cap').textContent = 'Поздняя регистрация';
    $('late-t').textContent = 'ЗАКРЫТА';
  } else {
    late.classList.remove('closed');
    $('late-cap').textContent = 'Поздняя регистрация';
    const after = lv.slice(cur + 1, g.lastRebuyLevel + 1).reduce((s, l) => s + l.minutes * MIN, 0);
    $('late-t').textContent = hhmmss(left + after);
  }
}

/* масштаб холста под окно */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `scale(${s}) translate(-50%,-50%)`;
}
addEventListener('resize', fit);

function receive(data) {
  if (data.serverNow) clockOffset = data.serverNow - Date.now();
  render(data);
}

paintIcons();
fit();
if (LIVE_KEY) {
  // EventSource сам переподключается после обрыва; сервер при подключении сразу шлёт состояние
  const src = new EventSource(`/t/${LIVE_KEY}/stream`);
  src.addEventListener('state', e => receive(JSON.parse(e.data)));
} else {
  render(demoGame());
  // демо: → переключает уровень, чтобы посмотреть, как листается структура
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') demoNextLevel(game); });
}
document.fonts.ready.then(fitBlinds);
setInterval(renderTimers, 1000);
</script>
